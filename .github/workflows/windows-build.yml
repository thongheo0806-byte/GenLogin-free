name: AutumnGenLogin quality gates (NO EXE release)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Application self-check
        run: python main.py --self-check
  browser-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser requirements
        run: python -m pip install -r requirements.txt
      - name: Install official Playwright Chromium
        run: python -m playwright install chromium
      - name: Run actual browser integration tests
        env:
          AUTUMN_E2E: '1'
        run: python -m unittest discover -s tests -p "test_browser_integration.py" -v
# IMPORTANT: This workflow deliberately has NO EXE build or release job.
# User requires demonstrated feature parity before a release build is allowed.
