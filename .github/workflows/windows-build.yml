name: AutumnGenLogin quality gates (NO EXE release)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and optional vision test requirements
        run: python -m pip install -r requirements-vision.txt
      - name: Assert OpenCV present on vision test lane
        run: python -c "import cv2; print(cv2.__version__)"
      - name: No retired browser manager imports
        shell: pwsh
        run: |
          if (Test-Path autumn_genlogin/browser.py) { throw "Legacy browser manager returned" }
          $hits = git grep -n -E 'from (autumn_genlogin\.browser|\.browser) import|import autumn_genlogin\.browser([[:space:]]|$)' -- '*.py'
          if ($LASTEXITCODE -eq 0) { throw ("Legacy imports: " + ($hits -join "; ")) }
          if ($LASTEXITCODE -ne 1) { throw "Legacy import scan failed" }
          Write-Output "No retired browser manager imports"
          exit 0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Application self-check
        run: python main.py --self-check
      - name: Tkinter UI structural smoke
        env:
          AUTUMN_GUI_SMOKE: '1'
        run: python -m unittest discover -s tests -p "test_gui_smoke.py" -v
  # Real Win32 GUI window control (not merely a withdrawn Tk structure smoke).
  # Hosted runners may have restricted input desktops; this lane tests OS
  # window visibility and state only, not screen-reader or mouse acceptance.
  windows-pywinauto-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and Windows-only pywinauto QA
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pywinauto>=0.6.9,<0.7"
      - name: Inspect real AutumnGenLogin GUI with Win32 automation
        env:
          AUTUMN_PYWINAUTO_SMOKE: '1'
        run: python -m unittest discover -s tests -p "test_windows_pywinauto.py" -v

  upgrade-existing-venv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulate previously installed environment without tzdata
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install playwright keyring
          .\.venv\Scripts\python.exe -m pip uninstall -y tzdata
          .\.venv\Scripts\python.exe -c "import importlib.util; assert importlib.util.find_spec('tzdata') is None"
      - name: Upgrade via existing Windows start script (NO EXE)
        shell: pwsh
        run: |
          cmd /c START-WINDOWS.cmd --self-check
          if ($LASTEXITCODE -ne 0) { throw "Startup upgrade regression" }
          .\.venv\Scripts\python.exe -c "import tzdata; from autumn_genlogin.models import Profile; Profile(timezone_id='UTC').validate()"
  browser-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser and optional vision integration requirements
        run: python -m pip install -r requirements-vision.txt
      - name: Install official Playwright Chromium
        run: python -m playwright install chromium
      - name: Install test-only process inspection library
        run: python -m pip install 'psutil>=6,<8'
      - name: Run shared-driver integration tests
        env:
          AUTUMN_E2E: '1'
        run: python -m unittest discover -s tests -p "test_shared_browser_integration.py" -v
      - name: Run actual browser integration tests
        env:
          AUTUMN_E2E: '1'
        run: python -m unittest discover -s tests -p "test_browser_integration.py" -v
# IMPORTANT: This workflow deliberately has NO EXE build or release job.
# User requires demonstrated feature parity before a release build is allowed.

  multi-engine-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install Chromium, Firefox, WebKit browser binaries
        run: python -m playwright install chromium firefox webkit
      - name: Real Firefox and WebKit profile smoke tests
        env:
          AUTUMN_E2E: '1'
          AUTUMN_MULTI_ENGINE: '1'
        run: python -m unittest discover -s tests -p "test_shared_browser_integration.py" -k multiengine -v
# No PyInstaller/EXE jobs. Release gates still block binary publication.

  branded-engine-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Verify preinstalled Chrome/Edge versions
        shell: pwsh
        run: |
          $chrome="${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $edge="${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $chrome)) { throw "Chrome is not installed on runner" }
          if (-not (Test-Path $edge)) { throw "Edge is not installed on runner" }
          Write-Output (Get-Item $chrome).VersionInfo.ProductVersion
          Write-Output (Get-Item $edge).VersionInfo.ProductVersion
      - name: Launch actual Google Chrome and Microsoft Edge
        env:
          AUTUMN_E2E: '1'
          AUTUMN_BRANDED_ENGINE: '1'
        run: python -m unittest discover -s tests -p "test_shared_browser_integration.py" -k branded -v

  # This does not execute an LLM. It checks the real Docker Compose-resolved
  # isolation contract without introducing browser-use into the desktop app.
  ai-lab-isolation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check AI lab network and mount isolation without running containers
        env:
          AUTUMN_LAB_OLLAMA_IMAGE: "ollama/ollama:static-contract-only"
          AUTUMN_LAB_OLLAMA_MODELS: "/tmp/synthetic-model-path"
          AUTUMN_LAB_MODEL: "synthetic:qa"
        run: |
          docker compose -f experiments/browser_use_lab/compose.yaml config --format json |
            python -m experiments.browser_use_lab.check_compose

  # An unverified proprietary-browser evidence form cannot unlock builds.
  titan-evidence-hold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence template explicitly refuses parity/release
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_titan_evidence.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Titan evidence validator regression" }
          python -m autumn_genlogin.titan_evidence examples/titan/reference-evidence-template.json
          if ($LASTEXITCODE -ne 1) { throw "Missing Titan evidence must exit 1 (release HOLD)" }
          @'
          import json
          from pathlib import Path
          from autumn_genlogin.titan_evidence import inspect_file
          result = inspect_file(Path("examples/titan/reference-evidence-template.json"))
          assert result["state"] == "blocked"
          assert result["can_build_exe"] is False
          assert result["can_claim_titan_parity"] is False
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Titan parity hold missing" }
# Explicit user instruction: NO EXE artifact, even if all CI lanes pass.
