name: Test and build AutumnGenLogin Windows EXE
on:
  push:
    branches: [main]
    paths:
      - "autumn_genlogin/**"
      - "tests/**"
      - "main.py"
      - "requirements*.txt"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-check application
        run: python main.py --self-check
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --name AutumnGenLogin --collect-all playwright --collect-all keyring main.py
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist\AutumnGenLogin.exe"
          $check = Start-Process -FilePath $exe -ArgumentList "--self-check" -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw "EXE self-check failed ($($check.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AutumnGenLogin-Windows-x64
          path: dist/AutumnGenLogin.exe
          if-no-files-found: error
          retention-days: 14
