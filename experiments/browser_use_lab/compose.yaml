# Run only after you have provisioned a trusted, offline Ollama model.
# No host ports, no shared application data directories, no external route.
name: autumngenlogin-ai-lab
services:
  ollama:
    image: ${AUTUMN_LAB_OLLAMA_IMAGE:?Choose and review an exact Ollama image version}
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/models"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      # Ollama may generate a local server identity on startup. Keep it
      # ephemeral; never mount credentials or user browser data.
      - /root/.ollama:rw,nosuid,nodev,size=32m
    volumes:
      # Point to the PRE-PROVISIONED models directory, not all of ~/.ollama.
      - type: bind
        source: ${AUTUMN_LAB_OLLAMA_MODELS:?Provide a local directory containing pre-provisioned offline model weights}
        target: /models
        read_only: true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [private-lab]
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      AUTUMN_AI_LAB_ISOLATED: "1"
      AUTUMN_LAB_MODEL: ${AUTUMN_LAB_MODEL:?Choose a model already provisioned locally}
      BROWSER_USE_AUTO_LOGIN: "false"
      ANONYMIZED_TELEMETRY: "false"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      OPENAI_API_KEY: ""
      BROWSER_USE_API_KEY: ""
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    shm_size: 256mb
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=512m
    networks: [private-lab]
networks:
  private-lab:
    internal: true
